name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Guard against hidden or bidi Unicode in workflows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const workflowDir = path.join(process.cwd(), ".github", "workflows");
          const candidates = fs.existsSync(workflowDir)
            ? fs
                .readdirSync(workflowDir)
                .filter((name) => name.endsWith(".yml") || name.endsWith(".yaml"))
                .map((name) => path.join(workflowDir, name))
            : [];

          const forbiddenRanges = [
            [0x202a, 0x202e], // bidi embedding/override
            [0x2066, 0x2069], // bidi isolates
            [0x200e, 0x200f], // LRM/RLM
            [0x061c, 0x061c], // Arabic letter mark
            [0x200b, 0x200d], // zero-width chars
            [0xfeff, 0xfeff], // BOM/ZWNBSP
          ];

          const findings = [];
          for (const file of candidates) {
            const text = fs.readFileSync(file, "utf8");
            let line = 1;
            let col = 1;
            for (const ch of text) {
              const cp = ch.codePointAt(0);
              const hit = forbiddenRanges.some(([start, end]) => cp >= start && cp <= end);
              if (hit) {
                findings.push({
                  file: path.relative(process.cwd(), file),
                  line,
                  col,
                  cp: `U+${cp.toString(16).toUpperCase().padStart(4, "0")}`,
                });
              }
              if (ch === "\n") {
                line += 1;
                col = 1;
              } else {
                col += 1;
              }
            }
          }

          if (findings.length > 0) {
            console.error("Forbidden hidden/bidi Unicode detected in workflow files:");
            for (const f of findings) {
              console.error(`- ${f.file}:${f.line}:${f.col} ${f.cp}`);
            }
            process.exit(1);
          }

          console.log("Workflow Unicode guard passed.");
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Run OpenAPI contract check
        run: pnpm run openapi:check

      - name: Run type check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Run build
        run: pnpm run build

      # Unit tests first, so a failure is reported before the browser download.
      - name: Run unit tests
        run: |
          pnpm run test:web --coverage
          pnpm run test:api --coverage
        env:
          CI: true

      # playwright.config.ts defines no projects and runs headless, so E2E only needs Chromium's
      # headless shell. It is downloaded from Playwright's CDN; `--with-deps` is avoided because
      # it goes through the runner's apt mirror, which repeatedly stalled on font packages the
      # tests never use, while ubuntu-latest already ships the shared libraries Chromium needs.
      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install --only-shell chromium

      - name: Check that Chromium launches
        id: chromium-launch
        continue-on-error: true
        timeout-minutes: 2
        run: node -e "require('playwright').chromium.launch().then((b) => b.close()).then(() => console.log('Chromium launches'))"

      # Fallback only if a runner image update removed a library Chromium needs. apt retries and a
      # per-connection timeout keep a stalled mirror from hanging the job.
      - name: Install Chromium system dependencies (fallback)
        if: steps.chromium-launch.outcome == 'failure'
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network > /dev/null
          pnpm exec playwright install-deps chromium
          node -e "require('playwright').chromium.launch().then((b) => b.close()).then(() => console.log('Chromium launches'))"

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Configure git for long paths and LF checkouts
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Run build
        run: pnpm run build

      # Server tests exercise real git worktrees, child-process spawning and path handling,
      # which is where Windows behaviour differs. E2E stays on the Linux job.
      - name: Run API tests
        run: pnpm exec vitest run --config server/vitest.config.ts
        env:
          CI: true

      - name: Run web tests
        run: pnpm exec vitest run --config vitest.config.ts
        env:
          CI: true
